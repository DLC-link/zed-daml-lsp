name = "DAML"
grammar = "haskell"
path_suffixes = ["daml"]
line_comments = ["-- "]
block_comment = ["{-", "-}"]
autoclose_before = ";:.,=}])> \n\t"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
]
word_characters = ["_", "'"]
tab_size = 2
